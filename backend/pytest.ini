[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
markers =
    unit: fast tests — no Postgres required
    integration: in-process API tests — needs Postgres (docker compose)
    e2e: smoke tests — in-process or E2E_BASE_URL for live HTTP
filterwarnings =
    error::RuntimeWarning:coroutine 'Connection._cancel' was never awaited
